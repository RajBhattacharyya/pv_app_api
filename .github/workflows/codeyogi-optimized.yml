name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Cache Node.js dependencies
        uses: actions/cache@v3
        id: cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Build and test
        run: |
          npm run build
          npm run test

      - name: Security scanning and dependency checks
        run: |
          npm audit

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/my-nextjs-app .
          docker push ${{ secrets.DOCKER_USERNAME }}/my-nextjs-app

      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          password: ${{ secrets.PROD_PASSWORD }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/my-nextjs-app
            docker stop my-nextjs-app || true
            docker rm my-nextjs-app || true
            docker run -d --name my-nextjs-app -p 80:80 ${{ secrets.DOCKER_USERNAME }}/my-nextjs-app

      - name: Notify on failure
        if: ${{ failure() }}
        uses: peter-evans/notify-slack@v2
        with:
          token: ${{ secrets.SLACK_TOKEN }}
          channel: ${{ secrets.SLACK_CHANNEL }}
          message: 'CI/CD pipeline failed'